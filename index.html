<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, user-scalable=no, initial-scale=1.0">
    <title>Sliders</title>
    <style>
        html,
        body,
        #canvas {
            margin: 0;
            padding: 0;
            border: 0;
        }

        body {
            color: white;
            background-color: black;
            overflow: hidden;
        }

        #canvas {
            display: block;
            touch-action: none;
        }

        #canvas:focus {
            outline: none;
        }

        #status,
        #status-splash,
        #status-progress {
            position: absolute;
            left: 0;
            right: 0;
        }

        #status,
        #status-splash {
            top: 0;
            bottom: 0;
        }

        #status {
            background-color: #242424;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            visibility: hidden;
        }

        #status-splash {
            max-height: 100%;
            max-width: 100%;
            margin: auto;
        }

        #status-splash.show-image--false {
            display: none;
        }

        #status-splash.fullsize--true {
            height: 100%;
            width: 100%;
            object-fit: contain;
        }

        #status-splash.use-filter--false {
            image-rendering: pixelated;
        }

        #status-progress,
        #status-notice {
            display: none;
        }

        #status-progress {
            bottom: 10%;
            width: 50%;
            margin: 0 auto;
        }

        #status-notice {
            background-color: #5b3943;
            border-radius: 0.5rem;
            border: 1px solid #9b3943;
            color: #e0e0e0;
            font-family: 'Noto Sans', 'Droid Sans', Arial, sans-serif;
            line-height: 1.3;
            margin: 0 2rem;
            overflow: hidden;
            padding: 1rem;
            text-align: center;
            z-index: 1;
        }
    </style>
    <link id="-gd-engine-icon" rel="icon" type="image/png" href="index.icon.png" />
    <link rel="apple-touch-icon" href="index.apple-touch-icon.png" />

    <!-- SDKs de Firebase Compat -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyC4MjGshf1ESaLkCOP0uWafJRRYkYymRqc",
            authDomain: "sliders-a67c5.firebaseapp.com",
            projectId: "sliders-a67c5",
            storageBucket: "sliders-a67c5.firebasestorage.app",
            messagingSenderId: "766830266792",
            appId: "1:766830266792:web:32b76c96f6ad6fe0feb59d"
        };

        if (!firebase.apps.length) {
            firebase.initializeApp(firebaseConfig);
        }

        // Variables globales para auth.gd
        window._currentUser = null;
        window._lastAuthError = "";

        firebase.auth().onAuthStateChanged((user) => {
            if (user) {
                user.getIdToken().then((idToken) => {
                    window._currentUser = {
                        uid: user.uid,
                        name: user.displayName || "Usuario",
                        token: idToken
                    };
                });
            } else {
                window._currentUser = null;
            }
        });

        window.authLoginGoogle = function () {
            const provider = new firebase.auth.GoogleAuthProvider();
            firebase.auth().signInWithPopup(provider).catch((error) => {
                window._lastAuthError = error.message;
            });
        };

        window.authLogout = function () {
            firebase.auth().signOut().catch((error) => {
                window._lastAuthError = error.message;
            });
        };

        // Puente para obtener récords en la versión web
        window.fetchFirestoreTopWeb = function (limit, callbackName) {
            firebase.firestore().collection("records_mundiales")
                .orderBy("score", "desc")
                .limit(limit)
                .get()
                .then((querySnapshot) => {
                    let docs = [];
                    querySnapshot.forEach((doc) => {
                        let d = doc.data();
                        docs.push({
                            name: d.name || "???",
                            score: parseInt(d.score || 0),
                            level: parseInt(d.level || 1)
                        });
                    });
                    if (window[callbackName]) {
                        window[callbackName](JSON.stringify(docs), true, 200);
                    }
                })
                .catch((error) => {
                    console.error("Error Firestore Web:", error);
                    if (window[callbackName]) {
                        window[callbackName]("[]", false, 500);
                    }
                });
        };

        // Puentes para subir puntajes en la versión web
        window.submitScoreWeb = function (name, score, level, skin) {
            firebase.firestore().collection("records_mundiales").add({
                name: name,
                score: score,
                level: level,
                skin: skin,
                timestamp: firebase.firestore.FieldValue.serverTimestamp()
            }).catch((error) => {
                console.error("Error submitting score web:", error);
            });
        };

        window.submitScoreUserWeb = function (uid, name, score, level, skin) {
            const docRef = firebase.firestore().collection("records_mundiales").doc(uid);
            docRef.get().then((doc) => {
                let prevScore = -1;
                if (doc.exists) {
                    prevScore = doc.data().score || -1;
                }
                if (score > prevScore) {
                    docRef.set({
                        uid: uid,
                        name: name,
                        score: score,
                        level: level,
                        skin: skin,
                        timestamp: firebase.firestore.FieldValue.serverTimestamp()
                    }, { merge: true }).catch((error) => {
                        console.error("Error writing user doc web:", error);
                    });
                }
            }).catch((error) => {
                console.error("Error getting user doc web:", error);
            });
        };

        // Puente para invocar el teclado nativo en móviles desde ui.gd
        window.requestMobileKeyboard = function (callbackName) {
            let existingOverlay = document.getElementById('mobile-keyboard-overlay');
            if (existingOverlay) {
                existingOverlay.remove();
            }

            const overlay = document.createElement('div');
            overlay.id = 'mobile-keyboard-overlay';
            overlay.style.position = 'fixed';
            overlay.style.top = '0';
            overlay.style.left = '0';
            overlay.style.width = '100%';
            overlay.style.height = '100%';
            overlay.style.backgroundColor = 'rgba(0, 0, 0, 0.85)';
            overlay.style.display = 'flex';
            overlay.style.flexDirection = 'column';
            overlay.style.justifyContent = 'center';
            overlay.style.alignItems = 'center';
            overlay.style.zIndex = '99999';
            overlay.style.pointerEvents = 'auto';
            overlay.style.touchAction = 'auto';

            const box = document.createElement('div');
            box.style.backgroundColor = '#0b1626';
            box.style.padding = '24px';
            box.style.borderRadius = '14px';
            box.style.border = '2px solid #1a525c';
            box.style.display = 'flex';
            box.style.flexDirection = 'column';
            box.style.alignItems = 'center';
            box.style.gap = '16px';
            box.style.width = '85%';
            box.style.maxWidth = '380px';
            box.style.boxSizing = 'border-box';

            const title = document.createElement('h3');
            title.innerText = 'Escribe tu nombre';
            title.style.color = 'white';
            title.style.fontFamily = 'sans-serif';
            title.style.margin = '0';
            title.style.fontSize = '22px';
            box.appendChild(title);

            const input = document.createElement('input');
            input.type = 'text';
            input.maxLength = 12;
            input.placeholder = 'Tu nombre';
            input.style.width = '100%';
            input.style.padding = '14px';
            input.style.fontSize = '22px';
            input.style.textAlign = 'center';
            input.style.borderRadius = '8px';
            input.style.border = '1px solid #257585';
            input.style.backgroundColor = '#122338';
            input.style.color = 'white';
            input.style.boxSizing = 'border-box';
            box.appendChild(input);

            const btn = document.createElement('button');
            btn.innerText = 'GUARDAR';
            btn.style.width = '100%';
            btn.style.padding = '14px';
            btn.style.fontSize = '18px';
            btn.style.backgroundColor = '#1a525c';
            btn.style.color = 'white';
            btn.style.border = 'none';
            btn.style.borderRadius = '8px';
            btn.style.cursor = 'pointer';
            box.appendChild(btn);

            overlay.appendChild(box);
            document.body.appendChild(overlay);

            setTimeout(() => {
                input.focus();
            }, 100);

            function submitName() {
                const val = input.value.trim();
                overlay.remove();
                if (window[callbackName]) {
                    window[callbackName](val);
                }
            }

            btn.onclick = submitName;
            input.onkeydown = function (e) {
                if (e.key === 'Enter') {
                    submitName();
                }
            };
        };
    </script>
</head>

<body>
    <canvas id="canvas">
        Your browser does not support the canvas tag.
    </canvas>

    <noscript>
        Your browser does not support JavaScript.
    </noscript>

    <div id="status">
        <img id="status-splash" class="show-image--true fullsize--true use-filter--true" src="index.png" alt="">
        <progress id="status-progress"></progress>
        <div id="status-notice"></div>
    </div>

    <script src="index.js"></script>
    <script>
        const GODOT_CONFIG = { "args": [], "canvasResizePolicy": 2, "emscriptenPoolSize": 8, "ensureCrossOriginIsolationHeaders": true, "executable": "index", "experimentalVK": false, "fileSizes": { "index.pck": 5113264, "index.wasm": 37902138 }, "focusCanvas": true, "gdextensionLibs": [], "godotPoolSize": 4 };
        const GODOT_THREADS_ENABLED = false;
        const engine = new Engine(GODOT_CONFIG);

        (function () {
            const statusOverlay = document.getElementById('status');
            const statusProgress = document.getElementById('status-progress');
            const statusNotice = document.getElementById('status-notice');

            let initializing = true;
            let statusMode = '';

            function setStatusMode(mode) {
                if (statusMode === mode || !initializing) {
                    return;
                }
                if (mode === 'hidden') {
                    statusOverlay.remove();
                    initializing = false;
                    return;
                }
                statusOverlay.style.visibility = 'visible';
                statusProgress.style.display = mode === 'progress' ? 'block' : 'none';
                statusNotice.style.display = mode === 'notice' ? 'block' : 'none';
                statusMode = mode;
            }

            function setStatusNotice(text) {
                while (statusNotice.lastChild) {
                    statusNotice.removeChild(statusNotice.lastChild);
                }
                const lines = text.split('\n');
                lines.forEach((line) => {
                    statusNotice.appendChild(document.createTextNode(line));
                    statusNotice.appendChild(document.createElement('br'));
                });
            }

            function displayFailureNotice(err) {
                console.error(err);
                if (err instanceof Error) {
                    setStatusNotice(err.message);
                } else if (typeof err === 'string') {
                    setStatusNotice(err);
                } else {
                    setStatusNotice('An unknown error occurred.');
                }
                setStatusMode('notice');
                initializing = false;
            }

            const missing = Engine.getMissingFeatures({
                threads: GODOT_THREADS_ENABLED,
            });

            if (missing.length !== 0) {
                if (GODOT_CONFIG['serviceWorker'] && GODOT_CONFIG['ensureCrossOriginIsolationHeaders'] && 'serviceWorker' in navigator) {
                    let serviceWorkerRegistrationPromise;
                    try {
                        serviceWorkerRegistrationPromise = navigator.serviceWorker.getRegistration();
                    } catch (err) {
                        serviceWorkerRegistrationPromise = Promise.reject(new Error('Service worker registration failed.'));
                    }
                    Promise.race([
                        serviceWorkerRegistrationPromise.then((registration) => {
                            if (registration != null) {
                                return Promise.reject(new Error('Service worker already exists.'));
                            }
                            return registration;
                        }).then(() => engine.installServiceWorker()),
                        new Promise((resolve) => {
                            setTimeout(() => resolve(), 2000);
                        }),
                    ]).then(() => {
                        window.location.reload();
                    }).catch((err) => {
                        console.error('Error while registering service worker:', err);
                    });
                } else {
                    const missingMsg = 'Error\nThe following features required to run Godot projects on the Web are missing:\n';
                    displayFailureNotice(missingMsg + missing.join('\n'));
                }
            } else {
                setStatusMode('progress');
                engine.startGame({
                    'onProgress': function (current, total) {
                        if (current > 0 && total > 0) {
                            statusProgress.value = current;
                            statusProgress.max = total;
                        } else {
                            statusProgress.removeAttribute('value');
                            statusProgress.removeAttribute('max');
                        }
                    },
                }).then(() => {
                    setStatusMode('hidden');
                }, displayFailureNotice);
            }
        }());
    </script>
</body>

</html>
