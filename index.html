    <style>
        html,
        body,
        #canvas {
            margin: 0;
            padding: 0;
            border: 0;
        }

        html,
        body {
            width: 100%;
            height: 100%;
        }

        body {
            color: white;
            background-color: #050b12;
            overflow: hidden;
            touch-action: none;
            overscroll-behavior: none;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
            -webkit-user-select: none;
            font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif;
        }

        #canvas {
            display: block;
        }

        #canvas:focus {
            outline: none;
        }

        #status,
        #status-splash,
        #status-progress {
            position: absolute;
            left: 0;
            right: 0;
        }

        #status,
        #status-splash {
            top: 0;
            bottom: 0;
        }

        #status {
            background: #050d1a;
            background-image: radial-gradient(circle at 50% 32%, rgba(35, 120, 110, .35), rgba(5, 11, 18, 1) 62%);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            gap: 14px;
            visibility: hidden;
            z-index: 5;
        }

        #status-splash {
            position: static;
            max-height: 164px;
            max-width: 164px;
            margin: 0 auto;
            border-radius: 28px;
            box-shadow: 0 12px 60px rgba(60, 255, 170, .18);
        }

        #status-splash.show-image--false {
            display: none;
        }

        #status-splash.fullsize--true {
            height: auto;
            width: auto;
            object-fit: contain;
        }

        #status-splash.use-filter--false {
            image-rendering: pixelated;
        }

        #brand {
            font-size: clamp(34px, 9vw, 54px);
            font-weight: 800;
            letter-spacing: .14em;
            color: #7dffb0;
            text-shadow: 0 0 28px rgba(80, 255, 160, .35);
            margin-top: 4px;
        }

        #brand-sub {
            font-size: 13px;
            letter-spacing: .22em;
            text-transform: uppercase;
            color: rgba(190, 215, 225, .65);
            margin-top: 2px;
        }

        #status-progress {
            position: static;
            bottom: auto;
            width: min(62vw, 320px);
            height: 8px;
            margin-top: 18px;
            border: 0;
            border-radius: 99px;
            overflow: hidden;
            background: rgba(255, 255, 255, .08);
            color: #6fffc0;
            accent-color: #6fffc0;
        }

        #status-progress::-webkit-progress-bar {
            background: rgba(255, 255, 255, .08);
            border-radius: 99px;
        }

        #status-progress::-webkit-progress-value {
            background: linear-gradient(90deg, #2fd0a0, #9dff78);
            border-radius: 99px;
        }

        #loading-tip {
            max-width: 76vw;
            text-align: center;
            font-size: 13px;
            line-height: 1.45;
            color: rgba(200, 220, 230, .62);
            margin-top: 2px;
        }

        #status-progress,
        #status-notice {
            display: none;
        }

        #status-notice {
            background-color: #5b3943;
            border-radius: .5rem;
            border: 1px solid #9b3943;
            color: #e0e0e0;
            line-height: 1.3;
            margin: 0 2rem;
            overflow: hidden;
            padding: 1rem;
            text-align: center;
            z-index: 1;
            font-size: 14px;
        }

        #mobile-keyboard-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, .86);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 99999;
            padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
            box-sizing: border-box;
        }

        #mobile-keyboard-overlay .kb-box {
            background: #0b1626;
            border: 2px solid #1a525c;
            border-radius: 16px;
            padding: 22px;
            width: min(88vw, 380px);
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            gap: 14px;
            box-shadow: 0 24px 80px rgba(0, 0, 0, .55);
        }

        #mobile-keyboard-overlay h3 {
            margin: 0;
            font-size: 22px;
            text-align: center;
        }

        #mobile-keyboard-overlay input {
            width: 100%;
            padding: 14px;
            font-size: 20px;
            text-align: center;
            color: white;
            background: #122338;
            border: 1px solid #257585;
            border-radius: 10px;
            box-sizing: border-box;
            outline: none;
        }

        #mobile-keyboard-overlay .kb-row {
            display: flex;
            gap: 10px;
        }

        #mobile-keyboard-overlay button {
            flex: 1;
            padding: 14px;
            font-size: 17px;
            font-weight: 700;
            border: 0;
            border-radius: 10px;
            color: white;
            background: #1a525c;
        }

        #mobile-keyboard-overlay button.ghost {
            background: #1a2633;
            color: #a8bbc6;
        }

        #mobile-keyboard-overlay button:active {
            filter: brightness(1.25);

    <!-- Firebase (auth + ranking). Si falla la carga, el juego sigue en local. -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
    <script>
        (function () {
            const firebaseConfig = {
                apiKey: "AIzaSyC4MjGshf1ESaLkCOP0uWafJRRYkYymRqc",
                authDomain: "sliders-a67c5.firebaseapp.com",
                projectId: "sliders-a67c5",
                storageBucket: "sliders-a67c5.firebasestorage.app",
                messagingSenderId: "766830266792",
                appId: "1:766830266792:web:32b76c96f6ad6fe0feb59d"
            };

            const isMobile = /Mobi|Android|iPhone|iPad|iPod/i.test(navigator.userAgent);
            const fb = (typeof firebase !== 'undefined') ? firebase : null;

            window._currentUser = null;
            window._lastAuthError = "";
            window._firebaseReady = false;

            if (fb) {
                try {
                    if (!fb.apps.length) fb.initializeApp(firebaseConfig);
                    window._firebaseReady = true;

                    fb.auth().onAuthStateChanged((user) => {
                        if (user) {
                            window._currentUser = {
                                uid: user.uid,
                                name: user.displayName || "Jugador"
                            };
                        } else {
                            window._currentUser = null;
                        }
                    });

                    fb.auth().getRedirectResult().catch((error) => {
                        if (error && error.code !== 'auth/no-auth-event') {
                            window._lastAuthError = error.message || String(error);
                        }
                    });

                    // Ranking: lee y deduplica por uid (o por nombre si es invitado).
                    window.fetchFirestoreTopWeb = function (limit, callbackName) {
                        const take = Math.max(1, Math.min(50, limit));
                        fb.firestore().collection("records_mundiales_s2")
                            .orderBy("score", "desc")
                            .limit(Math.min(take * 5, 100))
                            .get()
                            .then((snapshot) => {
                                const best = new Map();
                                snapshot.forEach((doc) => {
                                    const d = doc.data() || {};
                                    const row = {
                                        name: String(d.name || "???").slice(0, 16),
                                        score: parseInt(d.score || 0, 10) || 0,
                                        level: parseInt(d.level || 1, 10) || 1
                                    };
                                    const key = d.uid ? ("u:" + d.uid) : ("n:" + row.name.toLowerCase());
                                    const prev = best.get(key);
                                    if (!prev || row.score > prev.score) best.set(key, row);
                                });
                                const rows = Array.from(best.values())
                                    .sort((a, b) => b.score - a.score)
                                    .slice(0, take);
                                if (window[callbackName]) window[callbackName](JSON.stringify(rows), true, 200);
                            })
                            .catch((error) => {
                                console.error("Error Firestore Web:", error);
                                // permission-denied = la coleccion nueva aun no esta en las reglas.
                                const code = (error && error.code === "permission-denied") ? 403 : 500;
                                if (window[callbackName]) window[callbackName]("[]", false, code);
                            });
                    };

                    // Partida sin sesion: entrada anonima (el ranking la deduplica por nombre).
                    window.submitScoreWeb = function (name, score, level, skin) {
                        fb.firestore().collection("records_mundiales_s2").add({
                            name: String(name || "ANÓNIMO").slice(0, 16),
                            score: parseInt(score, 10) || 0,
                            level: parseInt(level, 10) || 1,
                            skin: parseInt(skin, 10) || 0,
                            timestamp: fb.firestore.FieldValue.serverTimestamp()
                        }).catch((error) => console.error("Error submitting score web:", error));
                    };

                    // Con sesion: un doc por uid y solo se actualiza si mejora.
                    window.submitScoreUserWeb = function (uid, name, score, level, skin) {
                        const user = fb.auth().currentUser;
                        if (!user) {
                            window.submitScoreWeb(name, score, level, skin);
                            return;
                        }
                        const docRef = fb.firestore().collection("records_mundiales_s2").doc(user.uid);
                        docRef.get().then((doc) => {
                            const prev = doc.exists ? (parseInt(doc.data().score || 0, 10) || 0) : -1;
                            if (score > prev) {
                                return docRef.set({
                                    uid: user.uid,
                                    name: String(name || user.displayName || "Jugador").slice(0, 16),
                                    score: parseInt(score, 10) || 0,
                                    level: parseInt(level, 10) || 1,
                                    skin: parseInt(skin, 10) || 0,
                                    timestamp: fb.firestore.FieldValue.serverTimestamp()
                                }, { merge: true });
                            }
                        }).catch((error) => console.error("Error writing user doc web:", error));
                    };
                } catch (error) {
                    console.error("Firebase init fallo:", error);
                    window._lastAuthError = String(error && error.message || error);
                }
            }

            // Si Firebase no esta disponible, el juego debe poder seguir en local.
            if (!window._firebaseReady) {
                window.fetchFirestoreTopWeb = function (_limit, callbackName) {
                    if (window[callbackName]) window[callbackName]("[]", false, 0);
                };
                window.submitScoreWeb = function () { };
                window.submitScoreUserWeb = function () { };
            }

            window.authLoginGoogle = function () {
                if (!window._firebaseReady) {
                    window._lastAuthError = "Firebase no está disponible";
                    return;
                }
                const provider = new fb.auth.GoogleAuthProvider();
                provider.setCustomParameters({ prompt: 'select_account' });
                const action = isMobile
                    ? fb.auth().signInWithRedirect(provider)
                    : fb.auth().signInWithPopup(provider);
                Promise.resolve(action).catch((error) => {
                    window._lastAuthError = error.message || String(error);
                });
            };

            window.authLogout = function () {
                if (!window._firebaseReady) return;
                fb.auth().signOut().catch((error) => {
                    window._lastAuthError = error.message || String(error);
                });
            };

            window.slidersVibrate = function (ms) {
                try {
                    if (navigator.vibrate) navigator.vibrate(Math.max(0, ms | 0));
                } catch (_) { }
            };

            // Teclado nativo para moviles (iOS/Android).
            window.requestMobileKeyboard = function (callbackName) {
                const old = document.getElementById('mobile-keyboard-overlay');
                if (old) old.remove();

                const overlay = document.createElement('div');
                overlay.id = 'mobile-keyboard-overlay';

                const box = document.createElement('div');
                box.className = 'kb-box';

                const title = document.createElement('h3');
                title.textContent = 'Escribe tu nombre';
                box.appendChild(title);

                const input = document.createElement('input');
                input.type = 'text';
                input.maxLength = 12;
                input.placeholder = 'Tu nombre';
                input.autocomplete = 'off';
                input.autocapitalize = 'words';
                input.spellcheck = false;
                box.appendChild(input);

                const row = document.createElement('div');
                row.className = 'kb-row';

                const cancel = document.createElement('button');
                cancel.className = 'ghost';
                cancel.textContent = 'Cancelar';
                cancel.onclick = () => overlay.remove();

                const save = document.createElement('button');
                save.textContent = 'Guardar';
                row.appendChild(cancel);
                row.appendChild(save);
                box.appendChild(row);
                overlay.appendChild(box);
                document.body.appendChild(overlay);

                setTimeout(() => input.focus(), 80);

                function submitName() {
                    const value = input.value.trim();
                    overlay.remove();
                    if (window[callbackName]) window[callbackName](value);
                }

                save.onclick = submitName;
                input.addEventListener('keydown', (event) => {
                    if (event.key === 'Enter') {
                        event.preventDefault();
                        submitName();
                    }
                });
            };
        })();
    </script>
</head>

<body>
    <canvas id="canvas">
        Your browser does not support the canvas tag.
    </canvas>

    <noscript>
        Your browser does not support JavaScript.
    </noscript>

    <div id="status">
        <img id="status-splash" class="show-image--false fullsize--true use-filter--true" src="index.icon.png" alt="Sliders">
        <div id="brand-sub">devora el mapa</div>
        <progress id="status-progress"></progress>
        <div id="loading-tip"></div>
        <div id="status-notice"></div>
    </div>

    <script src="index.js"></script>
    <script>
        const GODOT_CONFIG = {"args":[],"canvasResizePolicy":2,"emscriptenPoolSize":8,"ensureCrossOriginIsolationHeaders":true,"executable":"index","experimentalVK":false,"fileSizes":{"index.pck":1888836,"index.wasm":39514754},"focusCanvas":true,"gdextensionLibs":[],"godotPoolSize":4};
        const GODOT_THREADS_ENABLED = false;
        const engine = new Engine(GODOT_CONFIG);

        (function () {
            const statusOverlay = document.getElementById('status');
            const statusProgress = document.getElementById('status-progress');
            const statusNotice = document.getElementById('status-notice');
            const loadingTip = document.getElementById('loading-tip');

            const TIPS = [
                'Sal de tu zona segura y vuelve para encerrar territorio.',
                'Las estrellas te dan una vida (o puntos si ya tienes 3).',
                'El portal se abre al capturar el porcentaje indicado.',
                'Los enemigos rebotan en tu territorio: úsalo para acorralarlos.',
                'Puedes pausar con el botón II o con Esc.'
            ];
            loadingTip.textContent = TIPS[Math.floor(Math.random() * TIPS.length)];

            let initializing = true;
            let statusMode = '';

            function setStatusMode(mode) {
                if (statusMode === mode || !initializing) return;
                if (mode === 'hidden') {
                    statusOverlay.remove();
                    initializing = false;
                    return;
                }
                statusOverlay.style.visibility = 'visible';
                statusProgress.style.display = mode === 'progress' ? 'block' : 'none';
                statusNotice.style.display = mode === 'notice' ? 'block' : 'none';
                statusMode = mode;
            }

            function setStatusNotice(text) {
                while (statusNotice.lastChild) {
                    statusNotice.removeChild(statusNotice.lastChild);
                }
                const lines = text.split('\n');
                lines.forEach((line) => {
                    statusNotice.appendChild(document.createTextNode(line));
                    statusNotice.appendChild(document.createElement('br'));
                });
            }

            function displayFailureNotice(err) {
                console.error(err);
                if (err instanceof Error) {
                    setStatusNotice(err.message);
                } else if (typeof err === 'string') {
                    setStatusNotice(err);
                } else {
                    setStatusNotice('An unknown error occurred.');
                }
                setStatusMode('notice');
                initializing = false;
            }

            const missing = Engine.getMissingFeatures({
                threads: GODOT_THREADS_ENABLED,
            });

            if (missing.length !== 0) {
                if (GODOT_CONFIG['serviceWorker'] && GODOT_CONFIG['ensureCrossOriginIsolationHeaders'] && 'serviceWorker' in navigator) {
                    let serviceWorkerRegistrationPromise;
                    try {
                        serviceWorkerRegistrationPromise = navigator.serviceWorker.getRegistration();
                    } catch (err) {
                        serviceWorkerRegistrationPromise = Promise.reject(new Error('Service worker registration failed.'));
                    }
                    Promise.race([
                        serviceWorkerRegistrationPromise.then((registration) => {
                            if (registration != null) {
                                return Promise.reject(new Error('Service worker already exists.'));
                            }
                            return registration;
                        }).then(() => engine.installServiceWorker()),
                        new Promise((resolve) => {
                            setTimeout(() => resolve(), 2000);
                        }),
                    ]).then(() => {
                        window.location.reload();
                    }).catch((err) => {
                        console.error('Error while registering service worker:', err);
                    });
                } else {
                    const missingMsg = 'Error\nThe following features required to run Godot projects on the Web are missing:\n';
                    displayFailureNotice(missingMsg + missing.join('\n'));
                }
            } else {
                setStatusMode('progress');
                engine.startGame({
                    'onProgress': function (current, total) {
                        if (current > 0 && total > 0) {
                            statusProgress.value = current;
                            statusProgress.max = total;
                        } else {
                            statusProgress.removeAttribute('value');
                            statusProgress.removeAttribute('max');
                        }
                    },
                }).then(() => {
                    setStatusMode('hidden');
                }, displayFailureNotice);
            }
        }());
    </script>
</body>
